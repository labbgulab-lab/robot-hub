<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Hub</title>
<meta name="description" content="LabaLab Robot Hub: find the lab's robots, connect them and start their apps.">
<link rel="icon" type="image/png" href="/photos/labalab-mark.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- Starting: shown until the hub sends its first snapshot. -->
<div id="boot" class="over boot" role="status">
  <div class="center">
    <img class="mark" src="/photos/labalab-mark.png" alt="LabaLab">
    <span class="bigspin" aria-hidden="true"></span>
    <p class="muted" style="margin:0">Starting</p>
  </div>
</div>

<div class="app">
  <header class="top" id="top">
    <img class="logo" src="/photos/labalab-logo.png" alt="LabaLab">
    <span id="net-slot"></span>
    <span id="upd" class="upd" hidden><span id="upd-text">New version</span><button type="button" data-act="update">Update</button></span>
    <span class="spacer"></span>
    <span class="tgl" title="Connect each robot when it shows up">
      <button id="auto" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="auto-label" data-act="auto"><span></span></button>
      <span id="auto-label" class="tlabel">Auto-connect</span>
    </span>
    <button id="scan" class="btn btn-ghost btn-sm" type="button" title="Look for robots now" data-act="scan">Scan</button>
    <span id="live" class="live off" title="Robot Hub is running" role="status"><span class="ldot" aria-hidden="true"></span><span class="ltext">Connecting</span></span>
    <button id="logs-btn" class="btn btn-ghost btn-sm logs-btn" type="button" aria-pressed="false" data-act="logs">Logs</button>
    <button class="btn btn-ghost btn-sm btn-icon" type="button" aria-label="Settings" title="Settings" data-act="settings"><svg class="icon" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></button>
  </header>
  <div id="bar"></div>

  <!-- Robots (default view) -->
  <div id="view-robots" class="app" style="min-height:0;flex:1 1 auto">
    <main class="main" id="robots-main">
      <div class="pagehead">
        <h1 class="h1">Robots</h1>
        <div class="counts" id="counts" aria-live="polite"></div>
      </div>
      <div id="band"></div>
      <div class="grid" id="grid" aria-live="polite"></div>
      <div id="empty" class="emptywrap" hidden></div>
      <div class="away" id="away"></div>
      <p class="foot">The hub starts each robot's own app; it never replaces one.</p>
    </main>
  </div>

  <!-- Settings -->
  <div id="view-settings" hidden>
    <header class="backbar">
      <a class="btn btn-ghost btn-sm" href="#"><svg class="icon" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Robots</a>
      <span class="spacer"></span>
      <img class="logo" src="/photos/labalab-logo.png" alt="LabaLab">
    </header>
    <main class="main" id="settings-main" style="max-width:820px;gap:28px"></main>
  </div>

  <!-- Robot files (lab staff) -->
  <div id="view-files" hidden>
    <header class="backbar">
      <a class="btn btn-ghost btn-sm" href="#settings"><svg class="icon" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Settings</a>
      <span class="spacer"></span>
      <img class="logo" src="/photos/labalab-logo.png" alt="LabaLab">
    </header>
    <main class="main" id="files-main" style="max-width:960px"></main>
  </div>

  <!-- Demo on a phone hotspot -->
  <div id="view-hotspot" hidden>
    <header class="backbar">
      <a class="btn btn-ghost" href="#" style="padding:0 12px"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Robots</a>
      <span class="spacer"></span>
      <span id="hotspot-chip"></span>
    </header>
    <main class="hmain" id="hotspot-main"></main>
  </div>
</div>

<div id="sheet-layer"></div>
<div id="logs-layer"></div>
<div id="popup-layer"></div>
<div id="over-layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<noscript><p style="padding:24px;font:16px sans-serif">Turn on JavaScript to see the robots.</p></noscript>
<script src="/app.js"></script>
</body>
</html>
